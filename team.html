<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Team | Sydney Bush Dances</title>
    <link rel="icon" type="image/png" href="assets/logo_white.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="header-placeholder"></div>

    <main>
        <div class="page-header">
            <h1>Our Team</h1>
            <p class="tagline">Meet the passionate folks keeping the tradition alive.</p>
        </div>

        <section class="content-section">
            <div class="container">
                <div class="team-grid">
                    
                    <div class="team-card">
                        <div class="team-img-wrapper">
                            <img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&w=600&q=80" alt="Caleb Anderson" class="team-img">
                        </div>
                        <div class="team-info">
                            <h3>Caleb Anderson</h3>
                            <p class="team-title">Director, Caller & Musician</p>
                            <p class="team-bio">Caleb is an award winning musician with a passion for teaching. He has been running community events in the area for years, and has toured internationally across the world.</p>
                        </div>
                    </div>
                    
                </div>
            </div>
        </section>
    </main>

    <div id="footer-placeholder"></div>

    <script src="main.js"></script>
