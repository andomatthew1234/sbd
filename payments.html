<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Payment | Sydney Bush Dances</title>
    <link rel="icon" type="image/png" href="assets/logo_white.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="header-placeholder"></div>

    <main>
        <!-- Dynamic Page Header -->
        <div class="page-header">
            <h1 id="payment-title">Secure Payment</h1>
            <p class="tagline" id="payment-subtitle">Select your ticket option below to proceed to checkout.</p>
        </div>

        <!-- Dynamic Content Section -->
        <section class="content-section light-bg">
            <div class="container" id="payment-container">
                <!-- JavaScript will inject the payment cards here based on the URL -->
            </div>
        </section>
    </main>

    <div id="footer-placeholder"></div>

    <script src="main.js"></script>
</body>
</html>
